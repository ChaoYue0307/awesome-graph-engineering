# Link checker configuration.
# Sites that block CI crawlers are accepted on 403/429 rather than failed;
# the weekly scheduled run plus manual audits catch true rot.

max_redirects = 8
# Slow-but-alive hosts were failing the scheduled run on timeout alone.
max_retries = 3
timeout = 45
accept = ["200..299", "403", "405", "406", "429"]
scheme = ["https", "http"]

exclude = [
  # Pages deploys in a parallel workflow; verify the live site after deployment.
  "^https://chaoyue0307\\.github\\.io/awesome-graph-engineering",
  # Bot-hostile domains: block all non-browser traffic outright.
  "^https://x\\.com",
  "^https://twitter\\.com",
  "^https://www\\.linkedin\\.com",
  "^https://linkedin\\.com",
  "^https://openai\\.com",
  "^https://platform\\.openai\\.com",
  "^https://www\\.reddit\\.com",
  "^https://doi\\.org",
  "^https://dl\\.acm\\.org",
  "^https://ieeexplore\\.ieee\\.org",
  "^https://www\\.sciencedirect\\.com",
  "^https://link\\.springer\\.com",
  "^https://www\\.gartner\\.com",
  # AAAI's OJS endpoint intermittently rejects Lychee's HTTP/2 CI client even
  # when the canonical article pages load; records are verified manually.
  "^https://ojs\\.aaai\\.org",
  # Conway's own page for the 1968 paper answers in about 1.5s from a browser
  # but times out from GitHub-hosted runners; the record is verified manually.
  "^https://www\\.melconway\\.com",
]

# Only the generated site output is skipped. Excluding all of "docs" also
# excluded docs/llms.txt, which the workflow explicitly asks Lychee to check,
# so that file was silently never verified.
exclude_path = [
  "node_modules",
  "docs/index.html",
  "docs/404.html",
  "docs/app.js",
  "docs/i18n.js",
  "docs/graph-scene.js",
  "docs/assets",
  "docs/de",
  "docs/es",
  "docs/fr",
  "docs/ja",
  "docs/ko",
  "docs/pt-BR",
  "docs/zh-Hans",
]
